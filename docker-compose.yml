name: qa-infinity

# ── Named volumes ──────────────────────────────────────────────────────────
volumes:
  qa-data:
    driver: local
  qa-pgdata:
    driver: local
  qa-artifacts:
    driver: local
  qa-reqdocs:
    driver: local

# ── Services ───────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  qa-postgres:
    image: postgres:16-alpine
    container_name: qa-postgres
    restart: unless-stopped
    environment:
      - TZ=Asia/Kolkata
      - POSTGRES_DB=${POSTGRES_DB:-qa_infinity}
      - POSTGRES_USER=${POSTGRES_USER:-qauser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - qa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-qauser}", "-d", "${POSTGRES_DB:-qa_infinity}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '${QA_POSTGRES_CPU_LIMIT:-0.5}'
          memory: ${QA_POSTGRES_MEM_LIMIT:-512M}
        reservations:
          cpus: '${QA_POSTGRES_CPU_RESERVE:-0.1}'
          memory: ${QA_POSTGRES_MEM_RESERVE:-256M}
    networks:
      - qa-net

  # ── Redis ────────────────────────────────────────────────────────────────
  qa-redis:
    image: redis:7-alpine
    container_name: qa-redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then redis-server --requirepass "$$REDIS_PASSWORD"; else redis-server; fi'
    environment:
      - TZ=Asia/Kolkata
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    # No host port binding — services communicate over the internal qa-net network.
    healthcheck:
      test: >
        sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '${QA_REDIS_CPU_LIMIT:-0.25}'
          memory: ${QA_REDIS_MEM_LIMIT:-256M}
        reservations:
          cpus: '${QA_REDIS_CPU_RESERVE:-0.05}'
          memory: ${QA_REDIS_MEM_RESERVE:-64M}
    networks:
      - qa-net

  # ── API ──────────────────────────────────────────────────────────────────
  qa-api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: qa-infinity-qa-api:latest
    container_name: qa-api
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT:-4100}:4000"
      - "${PRISMA_STUDIO_HOST_PORT:-5655}:5555"   # Prisma Studio (dev only)
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      - NODE_ENV=development
      - PORT=4000
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@qa-redis:6379
      - DATABASE_URL=postgresql://${POSTGRES_USER:-qauser}:${POSTGRES_PASSWORD}@qa-postgres:5432/${POSTGRES_DB:-qa_infinity}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3100}
      - RUNNER_URL=http://qa-runner:5001
      - RUNNER_PRIMARY_URL=http://qa-runner:5001
      - NOVNC_HOST_PORT=${NOVNC_HOST_PORT:-6180}
      - MAX_VNC_SESSIONS=${MAX_VNC_SESSIONS:-6}
    depends_on:
      qa-redis:
        condition: service_healthy
      qa-postgres:
        condition: service_healthy
    volumes:
      - qa-data:/data
      - ./scripts:/scripts
      - qa-artifacts:/artifacts
      - qa-reqdocs:/requirements
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    extra_hosts:
      - "${TARGET_APP_HOSTNAME:-airtel6d-in-ventas-master-int-aavm-alpha-01.ocplab.6d.local}:${TARGET_APP_IP:-10.0.12.244}"
    deploy:
      resources:
        limits:
          cpus: '${QA_API_CPU_LIMIT:-0.75}'
          memory: ${QA_API_MEM_LIMIT:-1024M}
        reservations:
          cpus: '${QA_API_CPU_RESERVE:-0.25}'
          memory: ${QA_API_MEM_RESERVE:-512M}
    networks:
      - qa-net

  # ── Runners (×3) ─────────────────────────────────────────────────────────
  # qa-runner is the primary runner; it exposes noVNC on port 6080 for live viewing.
  # qa-runner-2 and qa-runner-3 are headless replicas that share the same scripts
  # and artifacts volumes. All three sit behind qa-runner-lb.
  qa-runner:
    build:
      context: .
      dockerfile: packages/runner/Dockerfile
    image: qa-infinity-qa-runner:latest
    container_name: qa-runner
    restart: unless-stopped
    environment:
      - TZ=Asia/Kolkata
      - MAX_VNC_SESSIONS=${MAX_VNC_SESSIONS:-6}
    shm_size: '256m'   # Chrome uses /tmp via --disable-dev-shm-usage; 256m covers Selenium fallback needs
    init: true         # Use tini as PID 1 to reap zombie processes from Chrome/Selenium workers
    depends_on:
      qa-api:
        condition: service_healthy
    ports:
      - "${NOVNC_HOST_PORT:-6180}:6080"    # noVNC live browser viewer — open in browser to watch tests run
    volumes:
      - ./scripts:/scripts
      - qa-artifacts:/artifacts
    extra_hosts:
      - "${TARGET_APP_HOSTNAME:-airtel6d-in-ventas-master-int-aavm-alpha-01.ocplab.6d.local}:${TARGET_APP_IP:-10.0.12.244}"
    deploy:
      resources:
        limits:
          cpus: '${QA_RUNNER_CPU_LIMIT:-4}'
          memory: ${QA_RUNNER_MEM_LIMIT:-6G}
        reservations:
          cpus: '${QA_RUNNER_CPU_RESERVE:-1}'
          memory: ${QA_RUNNER_MEM_RESERVE:-1G}
    networks:
      - qa-net

  # ── UI ───────────────────────────────────────────────────────────────────
  qa-ui:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    image: qa-infinity-qa-ui:latest
    container_name: qa-ui
    restart: unless-stopped
    environment:
      - TZ=Asia/Kolkata
    ports:
      - "${UI_HOST_PORT:-3100}:80"
    depends_on:
      qa-api:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        limits:
          cpus: '${QA_UI_CPU_LIMIT:-0.1}'
          memory: ${QA_UI_MEM_LIMIT:-64M}
        reservations:
          cpus: '${QA_UI_CPU_RESERVE:-0.05}'
          memory: ${QA_UI_MEM_RESERVE:-32M}
    networks:
      - qa-net

# ── Network ────────────────────────────────────────────────────────────────
networks:
  qa-net:
    driver: bridge

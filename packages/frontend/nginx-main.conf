# Unprivileged nginx main config — runs as a non-root user (nobody / uid 65534).
# All paths that nginx writes to at runtime are under /tmp so no root-owned
# directories are needed. The server-block config (listen port, proxy rules,
# static file serving) is mounted separately at /etc/nginx/conf.d/default.conf
# via docker-compose, keeping cluster-specific settings out of the image.

worker_processes auto;

# Write pid to /tmp — the default /var/run/nginx.pid is root-owned
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile        on;
    keepalive_timeout  65;

    # All temp paths under /tmp — required when running as a non-root user
    client_body_temp_path /tmp/nginx_client_temp;
    proxy_temp_path       /tmp/nginx_proxy_temp;
    fastcgi_temp_path     /tmp/nginx_fastcgi_temp;
    uwsgi_temp_path       /tmp/nginx_uwsgi_temp;
    scgi_temp_path        /tmp/nginx_scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}

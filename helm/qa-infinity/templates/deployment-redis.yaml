apiVersion: apps/v1
kind: Deployment
metadata:
  name: qa-redis
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "qa-infinity.labels" . | nindent 4 }}
    {{- include "qa-infinity.selectorLabels" (dict "name" "qa-redis") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "qa-infinity.selectorLabels" (dict "name" "qa-redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "qa-infinity.selectorLabels" (dict "name" "qa-redis") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999 # redis official image default
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}
        seccompProfile:
          type: {{ .Values.podSecurityContext.seccompProfile.type }}
      containers:
        - name: qa-redis
          image: {{ .Values.redisImage }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: TZ
              value: "Asia/Kolkata"
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: qa-infinity-secrets, key: REDIS_PASSWORD } }
          # --dir /tmp: RDB snapshot writes to /tmp (world-writable) instead of
          # the default /data, which is root-owned and fails under non-root.
          # --stop-writes-on-bgsave-error no: a failed bgsave would otherwise
          # silently block all writes while PING still succeeds (looks healthy,
          # isn't). See User Guide, "Redis — Non-Root Configuration".
          command: ["sh", "-c"]
          args:
            - |
              if [ -n "$REDIS_PASSWORD" ]; then
                redis-server --requirepass "$REDIS_PASSWORD" --dir /tmp --stop-writes-on-bgsave-error no
              else
                redis-server --dir /tmp --stop-writes-on-bgsave-error no
              fi
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "if [ -n \"$REDIS_PASSWORD\" ]; then redis-cli -a \"$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "if [ -n \"$REDIS_PASSWORD\" ]; then redis-cli -a \"$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources.redis | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: qa-redis
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "qa-infinity.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "qa-infinity.selectorLabels" (dict "name" "qa-redis") | nindent 4 }}
  ports:
    - port: 6379
      targetPort: 6379

# Mirrors nginx/nginx.conf verbatim (docker-compose bind-mounts that file
# read-only into qa-ui; here it's a ConfigMap mounted the same way).
#
# KEEP THIS IN SYNC BY HAND with ../../../nginx/nginx.conf — Helm charts
# can only read files from inside their own chart directory, so this is a
# deliberate copy, not a live reference. If you edit one, edit the other.
apiVersion: v1
kind: ConfigMap
metadata:
  name: qa-infinity-nginx-conf
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "qa-infinity.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 8080;  # Unprivileged port — image runs as nobody (uid 65534)
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ── Compression ────────────────────────────────────────────────────────
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types
            text/plain
            text/css
            text/javascript
            application/javascript
            application/json
            image/svg+xml
            font/woff
            font/woff2;

        # ── Security headers ───────────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── API reverse proxy ──────────────────────────────────────────────────
        location ^~ /api/ {
            client_max_body_size 2g;
            proxy_pass http://qa-api:4000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
            proxy_connect_timeout 10s;
        }

        # ── Socket.io reverse proxy (WebSocket) ───────────────────────────────
        location /socket.io/ {
            proxy_pass http://qa-api:4000/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── Hashed build assets (long cache) ───────────────────────────────────
        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── Unhashed static files at stable paths ──────────────────────────────
        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
            try_files $uri =404;
        }

        # ── SPA fallback ───────────────────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

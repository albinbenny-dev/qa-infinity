# Non-secret environment config. Compare against .env.example — everything
# in secret.yaml is the split-off other half (real passwords/keys).
apiVersion: v1
kind: ConfigMap
metadata:
  name: qa-infinity-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "qa-infinity.labels" . | nindent 4 }}
data:
  TZ: "Asia/Kolkata"
  APP_MODE: {{ .Values.appMode | quote }}
  NODE_ENV: "production"
  CORS_ORIGIN: {{ .Values.corsOrigin | quote }}
  APP_URL: {{ .Values.appUrl | quote }}
  ALLOWED_DOMAINS: {{ .Values.allowedDomains | quote }}
  JWT_EXPIRES_IN: {{ .Values.jwtExpiresIn | quote }}

  LLM_PROVIDER: {{ .Values.llm.provider | quote }}
  OPENROUTER_MODEL: {{ .Values.llm.openrouterModel | quote }}
  ANTHROPIC_MODEL: {{ .Values.llm.anthropicModel | quote }}
  LOCAL_LLM_BASE_URL: {{ .Values.llm.localBaseUrl | quote }}
  LOCAL_LLM_MODEL: {{ .Values.llm.localModel | quote }}
  LOCAL_LLM_SCRIPT_MODEL: {{ .Values.llm.localScriptModel | quote }}

  JIRA_HOST: {{ .Values.jira.host | quote }}
  JIRA_EMAIL: {{ .Values.jira.email | quote }}

  SMTP_HOST: {{ .Values.smtp.host | quote }}
  SMTP_PORT: {{ .Values.smtp.port | quote }}
  SMTP_SECURE: {{ .Values.smtp.secure | quote }}
  SMTP_USER: {{ .Values.smtp.user | quote }}
  SMTP_FROM: {{ .Values.smtp.from | quote }}

  RUNNER_CONTAINER_NAME: "qa-runner"
  PLAYWRIGHT_WORKERS: {{ .Values.playwrightWorkers | quote }}
  MAX_VNC_SESSIONS: {{ .Values.maxVncSessions | quote }}
  MAX_UPLOAD_BYTES: {{ .Values.maxUploadBytes | quote }}

  RETENTION_RUNRESULT_DAYS: {{ .Values.retention.runResultDays | quote }}
  RETENTION_HEAL_DAYS: {{ .Values.retention.healDays | quote }}
  RETENTION_LLMCALL_DAYS: {{ .Values.retention.llmCallDays | quote }}
  RETENTION_ARTIFACTS_DAYS: {{ .Values.retention.artifactsDays | quote }}
  RETENTION_VIDEO_DAYS: {{ .Values.retention.videoDays | quote }}
  RETENTION_TRACE_DAYS: {{ .Values.retention.traceDays | quote }}
  RETENTION_SCREENSHOT_DAYS: {{ .Values.retention.screenshotDays | quote }}
  MAX_RUNS_PER_PROJECT: {{ .Values.retention.maxRunsPerProject | quote }}

  # Service DNS names replace docker-compose's container-name DNS.
  # DATABASE_URL / REDIS_URL are assembled in deployment-api.yaml instead of
  # here, since they embed the secret password via $(VAR) env interpolation.
  RUNNER_URL: "http://qa-runner:5001"
  RUNNER_PRIMARY_URL: "http://qa-runner:5001"

# Split off from configmap.yaml — everything here is a real credential.
# See values.yaml's header comment: pass real values via a separate
# gitignored values-secrets.yaml, don't commit them in plain values.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: qa-infinity-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "qa-infinity.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDb | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  OPENROUTER_API_KEY: {{ .Values.secrets.openrouterApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  LOCAL_LLM_API_KEY: {{ .Values.secrets.localLlmApiKey | quote }}
  JIRA_API_TOKEN: {{ .Values.secrets.jiraApiToken | quote }}
  SMTP_PASS: {{ .Values.secrets.smtpPass | quote }}

upstream qa_runner_pool {
    server qa-runner:5001   max_fails=3 fail_timeout=15s;
    server qa-runner-2:5001 max_fails=3 fail_timeout=15s;
}

server {
    listen 5001;
    server_tokens off;

    # Each test run can take up to 15 minutes (900 s hard-kill in runner).
    # Add a 70 s buffer over the hard-kill so nginx never cuts the connection
    # before the runner has a chance to return a terminal response.
    proxy_read_timeout    970s;
    proxy_send_timeout    970s;
    proxy_connect_timeout 10s;

    # Scripts and response payloads can be large.
    client_max_body_size  200m;

    location / {
        proxy_pass          http://qa_runner_pool;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Disable response buffering so streaming test output reaches the
        # runWorker in real time rather than being held in nginx memory.
        proxy_buffering     off;
    }
}
